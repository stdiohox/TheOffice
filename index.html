<!doctype html>
<html lang="en">
  <head>
    <script>
      // Runs before first paint so a dark-mode user never sees an ivory flash.
      // Mirrors themeStore's resolution; kept tiny and dependency-free.
      (function () {
        try {
          var raw = localStorage.getItem('office-demo-theme');
          var t = raw ? (JSON.parse(raw).state || {}).theme : 'system';
          var r =
            t === 'dark' || t === 'light'
              ? t
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', r);
          document.documentElement.style.colorScheme = r;
        } catch (e) {}
      })();
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Internal tool. It must never appear in a search result. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>BRIGHTWORK Office</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
  </head>
  <body>
    <div id="root">
      <div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;font-family:Nunito,system-ui,sans-serif;color:#59665e">
        <p role="status" id="opening" style="max-width:30ch;text-align:center;line-height:1.5">Opening the office…</p>
      </div>
    </div>
    <script>
      // The first visit downloads the database; from then on it opens at once.
      setTimeout(function () {
        var p = document.getElementById('opening');
        if (p) p.textContent = 'Setting up the office for the first time. This takes up to half a minute, and is instant after that.';
      }, 4000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
